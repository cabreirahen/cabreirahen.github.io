<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabreira Store · Desbloqueio PS4</title>
<link rel="stylesheet" href="cabreira.css">
<link rel="stylesheet" href="layout-v2.css">
<style>
  .mark { width:150px; height:150px; margin-bottom:6px; }
  h1 { margin:0; font-size:44px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; line-height:1.05; }
  h1 .c2 { color:var(--xb-bright); }
  .sub { margin:6px 0 18px; color:var(--muted); font-size:17px; letter-spacing:.04em; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 24px; }
  #state { font-size:22px; font-weight:800; margin:0 0 4px; }
  #det { font-size:15px; color:var(--muted); margin:0 0 2px; }
  #det b { color:var(--text); font-weight:700; }
  #cache { font-size:13px; color:#75839b; margin:0; min-height:16px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#ff8f7a; } .warn { color:#f2c763; }
  .credit { position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:13px; color:#75839b; }
  @media (max-width:760px) { h1 { font-size:30px; } .mark { width:110px; height:110px; } }
</style>
</head>
<body>
<div class="row">
  <div class="qrcard">
    <img src="qr_whatsapp.svg" alt="QR code do WhatsApp">
    <div class="kicker">Suporte Cabreira Store</div>
    <div class="num">(48) 98822-3759</div>
    <p>Aponte a câmera do celular para o QR code e chame no WhatsApp.</p>
  </div>
  <div class="main">
    <img class="mark" src="cabreira_logo.png" alt="Cabreira Store">
    <h1>Cabreira <span class="c2">Store</span></h1>
    <p class="sub">Desbloqueio de PS4 · GoldHEN</p>
    <div class="panel" id="wrap">
      <div id="state">Verificando firmware...</div>
      <div id="det"></div>
      <div id="cache"></div>
    </div>
  </div>
</div>
<div class="credit">Exploit por raw13g · GoldHEN por SiSTR0</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "Firmware <b>" + (key || "desconhecido") + "</b>"
        + (supported ? " &middot; <b class=\"ok\">compatível</b>"
                     : " &middot; fora da lista desta versão");

    var target = "jb.html" + location.search;
    function go() { setState("Iniciando desbloqueio...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("FIRMWARE NÃO SUPORTADO", "bad");
        waitForTap("Firmware " + (key || "desconhecido") + " não suportado. Pressione X para tentar mesmo assim", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("sem internet: usando a cópia salva", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("salvo no console", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("atualização baixada", true);
        waitForTap("Atualização pronta! Pressione X para recarregar e iniciar",
                   function () { location.reload(); });
    } else {
        setCache("verificando arquivos salvos...");
        ac.addEventListener("downloading",
            function () { setCache("salvando para uso offline (primeira vez)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("salvando " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("salvo para uso offline", true);
            waitForTap("Tudo pronto! Pressione X para iniciar o desbloqueio", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("atualização baixada", true);
            waitForTap("Atualização pronta! Pressione X para recarregar e iniciar",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("salvo no console: funciona offline", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("não foi possível salvar offline");
            waitForTap("Pressione X para iniciar mesmo assim", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cópia salva desatualizada");
            waitForTap("Pressione X para iniciar", go);
        }, false);
    }
})();
</script>
</body>
</html>
